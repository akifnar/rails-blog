services:
  web:
    build: .
    volumes:
      - .:/rails # Kodun tamamını bağla
      - ./log:/rails/log
      - ./storage:/rails/storage
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis-db:6379/1
    depends_on:
      redis-db:
        condition: service_started

  redis-db:
    image: redis:alpine
