services:
  web:
    build: .
    volumes:
      - .:/rails
      - ./log:/rails/log
      - ./storage:/rails/storage
      - ./db:/rails/db
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis-db:6379/1 
    depends_on:
      redis-db:
        condition: service_started

  redis-db:
    image: redis:7-alpine
    volumes:
      - ./tmp/redis-db:/data
    ports:
      - "6379:6379"
    networks:
      - default 


